name: Manual AI assistance and Pages

# Explicit manual run only. Never collect, schedule, enable billing or select reports.
on:
  workflow_dispatch:
    inputs:
      free_project_confirmed:
        description: 'Gemini 프로젝트가 Free·결제 미연결임을 확인했고 공개 데이터 이용조건을 확인했습니다'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-trend-publish
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      data_sha: ${{ steps.persist.outputs.sha }}
      artifact_name: ${{ steps.base.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Remember starting revision
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=github-pages-ai-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Verify behavior and existing snapshot
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js
          node --check site/review.js
          node --check site/ai.js
          node --test tests/test_review.js tests/test_ai.js
          python -m weekly_trend verify --root .
      - name: Analyze permitted public facts or save the waiting state
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_FREE_PROJECT_CONFIRMED: ${{ inputs.free_project_confirmed }}
        run: python scripts/analyze.py --root . --run
      - name: Verify the AI sidecar and unchanged collection
        run: |
          python scripts/analyze.py --root . --check
          python -m weekly_trend verify --root .
      - name: Persist only AI assistance
        id: persist
        env:
          START_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$START_SHA" ]; then
            echo 'Main changed during analysis. No overwrite or deployment performed.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/ai-analysis.json site/data/ai-analysis.json
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: save manual AI assistance and waiting state'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record analysis status
        run: python scripts/write_ai_summary.py
      - name: Package the website only
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: ${{ steps.base.outputs.artifact_name }}
          path: site

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Reject obsolete deployment
        env:
          DATA_SHA: ${{ needs.analyze.outputs.data_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$DATA_SHA" ]; then
            echo 'A newer main revision exists. Run the manual workflow again.' >&2
            exit 1
          fi
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ needs.analyze.outputs.artifact_name }}
