name: Demo checks

on:
  push:
    branches: [main]
    paths:
      - 'weekly_trend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'reports/**'
      - 'site/*.html'
      - 'site/*.css'
      - 'site/*.js'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core behavior tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check site/app.js
      - name: Independent-process persistence check
        run: python scripts/check_repeatability.py

