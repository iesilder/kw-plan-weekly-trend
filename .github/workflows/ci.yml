name: Collection checks

on:
  push:
    branches: [main]
    paths:
      - 'weekly_trend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'reports/**'
      - 'site/*.html'
      - 'site/*.css'
      - 'site/*.js'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Core behavior tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/review.js
          node --check site/ai.js
          node --check site/article.js
          node --check site/interests.js
      - name: Review selection and duplicate-candidate tests
        run: node --test tests/test_*.js
      - name: Independent-process persistence check
        run: python scripts/check_repeatability.py

