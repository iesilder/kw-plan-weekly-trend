name: Save review choices and Pages

# Human choices only. This workflow never collects articles, calls AI, or records
# delivered reports. The input is parsed as JSON data and never as shell code.
on:
  workflow_dispatch:
    inputs:
      review_patch:
        description: 'Paste the review JSON copied from the website (public choices only)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-trend-publish
  cancel-in-progress: false

jobs:
  save:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      data_sha: ${{ steps.persist.outputs.sha }}
      artifact_name: ${{ steps.base.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Remember starting revision
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=github-pages-review-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Verify behavior and existing snapshot
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js
          node --check site/review.js
          node --test tests/test_review.js
          python -m weekly_trend verify --root .
      - name: Save the submitted review choices
        env:
          REVIEW_PATCH: ${{ inputs.review_patch }}
        run: printf '%s' "$REVIEW_PATCH" | python scripts/apply_reviews.py --root .
      - name: Verify saved review choices and unchanged source snapshot
        run: |
          python scripts/apply_reviews.py --root . --check
          python -m weekly_trend verify --root .
      - name: Persist only the review choices
        id: persist
        env:
          START_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$START_SHA" ]; then
            echo 'Main changed during this run. Reload the website before saving again.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/reviews.json site/data/reviews.json
          if ! git diff --cached --quiet; then
            git commit -m 'review: save human report candidate choices'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Package the website only
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: ${{ steps.base.outputs.artifact_name }}
          path: site

  deploy:
    needs: save
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Reject obsolete deployment
        env:
          DATA_SHA: ${{ needs.save.outputs.data_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$DATA_SHA" ]; then
            echo 'A newer main revision exists. Run the manual workflow again with a current review patch.' >&2
            exit 1
          fi
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ needs.save.outputs.artifact_name }}
